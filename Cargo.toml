[package]
name = "regex-utils-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[[bin]]
name = "regextrie-rust"
path = "src/bin/regextrie_rust.rs"

[[bin]]
name = "rand-regex"
path = "src/bin/rand_regex.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
rand = "=0.10.0"
rand_regex = "=0.19.0"
regex-syntax = "=0.8.9"
regextrie = "=0.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
regex = "=1.12.2"
