[package]
name = "regex-utils-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[[bin]]
name = "regextrie-rust"
path = "src/bin/regextrie_rust.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
regextrie = "=0.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
